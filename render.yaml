services:
  - type: web
    name: docshield-chronos
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node backend/server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DOCSHIELD_DEMO_PASSWORD
        sync: false
    disk:
      name: docshield-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
